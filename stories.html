<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📚%3C/text%3E%3C/svg%3E">
<title>Социальные истории — портфолио учителя-дефектолога</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Портфолио учителя-дефектолога</a>
  <nav><a href="index.html">Главная</a><a href="about.html">Об учителе</a><a href="subjects.html">Предметы</a><a href="stories.html" class="on">Социальные истории</a><a href="contacts.html">Контакты</a></nav>
</div></header>
<main class="wrap">
<section class="view on">
  <p class="eyebrow">Для детей</p>
  <h1>Социальные истории</h1>
  <p class="lead" style="margin-bottom:24px">Короткие презентации с простыми объяснениями. Откройте историю и листайте слайды кнопками или пальцем.</p>
  <div class="grid" id="storylist"></div>
  <noscript><p>Для просмотра списка нужен включённый JavaScript.</p></noscript>
  <script src="stories-data.js"></script>
  <script>
    document.getElementById('storylist').innerHTML = STORIES.map(function(s){
      return '<a class="card" href="story.html?id='+encodeURIComponent(s.id)+'"><span class="ico">'+(s.icon||'📖')+'</span><h3></h3><p></p></a>';
    }).join('');
    document.querySelectorAll('#storylist .card').forEach(function(c,i){
      c.querySelector('h3').textContent = STORIES[i].title;
      c.querySelector('p').textContent = STORIES[i].text || '';
    });
  </script>
</section>
</main>
<footer>© Имя Фамилия, 2026. Макет сайта</footer>
</body>
</html>
