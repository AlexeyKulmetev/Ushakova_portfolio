<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📚%3C/text%3E%3C/svg%3E">
<title>Социальные истории — портфолио учителя-дефектолога</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Портфолио учителя-дефектолога</a>
  <nav><a href="index.html">Главная</a><a href="about.html">Об учителе</a><a href="subjects.html">Предметы</a><a href="stories.html" class="on">Социальные истории</a><a href="contacts.html">Контакты</a></nav>
</div></header>
<main class="wrap">
<section class="view on">
  <p class="crumbs"><a href="stories.html">Социальные истории</a> / <span id="crumb"></span></p>
  <h1 id="title"></h1>
  <div class="reader" id="reader" aria-live="polite">
    <div class="stage" id="stage"></div>
    <div class="controls" id="controls">
      <button type="button" class="b alt" id="prev">← Назад</button>
      <span id="pos"></span>
      <button type="button" class="b" id="next">Далее →</button>
    </div>
    <div class="bar" id="bar"><span id="fill"></span></div>
    <button type="button" class="b alt" id="mode" style="margin-top:18px">Показать все шаги списком</button>
  </div>
  <p id="msg" style="display:none">История не найдена. <a href="stories.html" style="color:var(--teal)">Вернуться к списку</a></p>
  <a class="dl" id="dl" style="display:none"></a>
  <script src="stories-data.js"></script>
  <script>
  (function(){
    var id=new URLSearchParams(location.search).get('id');
    var st=STORIES.filter(function(x){return x.id===id})[0];
    var $=function(k){return document.getElementById(k)};
    if(!st){$('reader').style.display='none';$('msg').style.display='block';return;}
    document.title=st.title+' — портфолио учителя-дефектолога';
    $('title').textContent=st.title; $('crumb').textContent=st.title;
    if(st.download){var d=$('dl');d.href=st.download;d.setAttribute('download','');d.textContent=st.downloadLabel||'Скачать файл';d.style.display='inline-block';}
    var isSteps=st.type==='steps', n=isSteps?st.steps.length:st.count, i=1, list=false;
    var stage=$('stage');
    function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
    function pad(k){return (k<10?'0':'')+k}
    function stepCard(k){
      var s=st.steps[k-1], c=el('div','stepcard');
      var lines=s.text.split('\n'), p=el('p','txt',lines[0]); c.appendChild(p);
      if(lines.length>1){var ul=el('ul','pts');lines.slice(1).forEach(function(l){ul.appendChild(el('li','',l.replace(/^[-–•]\s*/,'')))});c.appendChild(ul);}
      var pics=el('div','pics');
      s.images.forEach(function(m){
        var f=el('figure'), im=el('img');
        im.src=st.folder+'/'+m.img; im.alt=m.caption||''; im.loading='lazy';
        f.appendChild(im); if(m.caption)f.appendChild(el('figcaption','',m.caption)); pics.appendChild(f);
      });
      c.appendChild(pics);
      return c;
    }
    function render(){
      stage.innerHTML='';
      $('controls').style.display=$('bar').style.display=list?'none':'';
      $('mode').textContent=list?'Показывать по одному шагу':(isSteps?'Показать все шаги списком':'Показать все слайды списком');
      stage.className='stage'+(isSteps?' steps':'');
      if(list){
        for(var k=1;k<=n;k++){
          if(isSteps){var w=el('div','listitem');w.appendChild(el('span','num',String(k)));w.appendChild(stepCard(k));stage.appendChild(w);}
          else{var im=el('img');im.src=st.folder+'/'+pad(k)+'.jpg';im.alt='Слайд '+k+' из '+n;im.loading='lazy';stage.appendChild(im);}
        }
        stage.classList.add('all'); return;
      }
      if(isSteps){stage.appendChild(stepCard(i));}
      else{var im2=el('img');im2.src=st.folder+'/'+pad(i)+'.jpg';im2.alt='Слайд '+i+' из '+n;stage.appendChild(im2);}
      $('pos').textContent=(isSteps?'Шаг ':'Слайд ')+i+' из '+n;
      $('fill').style.width=(i/n*100)+'%';
      $('prev').disabled=(i===1); $('next').disabled=(i===n);
    }
    function go(k){i=Math.max(1,Math.min(n,k));render();}
    $('prev').onclick=function(){go(i-1)}; $('next').onclick=function(){go(i+1)};
    $('mode').onclick=function(){list=!list;render();window.scrollTo(0,0)};
    document.addEventListener('keydown',function(e){if(list)return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
    var x0=null;
    stage.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
    stage.addEventListener('touchend',function(e){if(x0===null||list)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60)go(i+(dx<0?1:-1));x0=null});
    render();
  })();
  </script>
</section>
</main>
<footer>© Имя Фамилия, 2026. Макет сайта</footer>
</body>
</html>
