<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📚%3C/text%3E%3C/svg%3E">
<title>Социальные истории — портфолио учителя-дефектолога</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Портфолио учителя-дефектолога</a>
  <nav><a href="index.html">Главная</a><a href="about.html">Об учителе</a><a href="subjects.html">Предметы</a><a href="stories.html" class="on">Социальные истории</a><a href="contacts.html">Контакты</a></nav>
</div></header>
<main class="wrap">
<section class="view on">
  <p class="crumbs"><a href="stories.html">Социальные истории</a> / <span id="crumb"></span></p>
  <h1 id="title"></h1>
  <div class="reader" id="reader" aria-live="polite">
    <div class="stage"><img id="slide" alt=""></div>
    <div class="controls">
      <button type="button" class="b alt" id="prev">← Назад</button>
      <span id="pos"></span>
      <button type="button" class="b" id="next">Далее →</button>
    </div>
    <div class="bar"><span id="fill"></span></div>
  </div>
  <p id="msg" style="display:none">История не найдена. <a href="stories.html" style="color:var(--teal)">Вернуться к списку</a></p>
  <a class="dl" id="dl" style="display:none">Скачать презентацию (PowerPoint)</a>
  <script src="stories-data.js"></script>
  <script>
  (function(){
    var id = new URLSearchParams(location.search).get('id');
    var st = STORIES.filter(function(x){return x.id===id})[0];
    if(!st){document.getElementById('reader').style.display='none';document.getElementById('msg').style.display='block';return;}
    document.title = st.title+' — портфолио учителя-дефектолога';
    document.getElementById('title').textContent = st.title;
    document.getElementById('crumb').textContent = st.title;
    if(st.download){var d=document.getElementById('dl');d.href=st.download;d.setAttribute('download','');d.style.display='inline-block';}
    var i=1, n=st.count, img=document.getElementById('slide');
    function src(k){return st.folder+'/'+(k<10?'0':'')+k+'.jpg'}
    function show(k){
      i=Math.max(1,Math.min(n,k));
      img.src=src(i); img.alt='Слайд '+i+' из '+n;
      document.getElementById('pos').textContent=i+' из '+n;
      document.getElementById('fill').style.width=(i/n*100)+'%';
      document.getElementById('prev').disabled=(i===1);
      document.getElementById('next').disabled=(i===n);
      if(i<n){new Image().src=src(i+1);}
    }
    document.getElementById('prev').onclick=function(){show(i-1)};
    document.getElementById('next').onclick=function(){show(i+1)};
    document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});
    var x0=null;
    img.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
    img.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(i+(dx<0?1:-1));x0=null});
    show(1);
  })();
  </script>
</section>
</main>
<footer>© Имя Фамилия, 2026. Макет сайта</footer>
</body>
</html>
